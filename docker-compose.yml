name: ${COMPOSE_PROJECT_NAME:-innovation-vision-ia}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vision}
      POSTGRES_USER: ${POSTGRES_USER:-vision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./architecture/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./architecture/migrations/002_p2p_runtime.sql:/docker-entrypoint-initdb.d/002-p2p-runtime.sql:ro
      - ./architecture/migrations/003_streambroker_failover.sql:/docker-entrypoint-initdb.d/003-streambroker-failover.sql:ro
      - ./architecture/migrations/004_reactive_ingestion.sql:/docker-entrypoint-initdb.d/004-reactive-ingestion.sql:ro
      - ./architecture/migrations/005_core_pipeline.sql:/docker-entrypoint-initdb.d/005-core-pipeline.sql:ro
      - ./architecture/migrations/006_portal_auth.sql:/docker-entrypoint-initdb.d/006-portal-auth.sql:ro
      - ./architecture/migrations/007_client_rls.sql:/docker-entrypoint-initdb.d/007-client-rls.sql:ro
      - ./architecture/migrations/008_alert_policies.sql:/docker-entrypoint-initdb.d/008-alert-policies.sql:ro
      - ./architecture/migrations/009_p2p_failover_operations.sql:/docker-entrypoint-initdb.d/009-p2p-failover-operations.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vision} -d ${POSTGRES_DB:-vision}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vision_backend]

  db-migrate:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - ./architecture/migrations:/migrations:ro
    command: ["sh", "-c", "set -e; for f in /migrations/*.sql; do echo Applying $$f; psql -h postgres -U ${POSTGRES_USER:-vision} -d ${POSTGRES_DB:-vision} -v ON_ERROR_STOP=1 -f $$f; done"]
    networks: [vision_backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "${REDIS_MAXMEMORY:-2gb}", "--maxmemory-policy", "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"]
    volumes: ["./data/redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vision_backend]

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes: ["./data/minio:/data"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    networks: [vision_backend]

  api:
    build: {context: ./core/api}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision}
      TZ: ${TZ:-America/Sao_Paulo}
      VISION_INITIAL_ADMIN_USERNAME: ${VISION_INITIAL_ADMIN_USERNAME:-innovation-admin}
      VISION_INITIAL_ADMIN_PASSWORD: ${VISION_INITIAL_ADMIN_PASSWORD:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-visionminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_EVIDENCE_BUCKET:-vision-evidence}
      FAILOVER_ORCHESTRATOR_URL: http://failover-orchestrator:8092
      FAILOVER_API_TIMEOUT: ${FAILOVER_API_TIMEOUT:-60}
      T2U_CAPTURE_URL: ${T2U_CAPTURE_URL:-}
      T2U_CAPTURE_TIMEOUT: ${T2U_CAPTURE_TIMEOUT:-30}
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      minio: {condition: service_started}
    ports: ["127.0.0.1:${VISION_API_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [vision_backend]

  ingestion-api:
    build: {context: ./ingestion}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision}
      REDIS_URL: redis://redis:6379/0
      INGESTION_REDIS_STREAM: ${INGESTION_REDIS_STREAM:-vision:ingestion:events}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-visionminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_INGESTION_BUCKET: ${MINIO_EVIDENCE_BUCKET:-vision-evidence}
      INGESTION_MAX_BODY_BYTES: ${INGESTION_MAX_BODY_BYTES:-12582912}
      INGESTION_MAX_SNAPSHOT_BYTES: ${INGESTION_MAX_SNAPSHOT_BYTES:-10485760}
      INGESTION_HMAC_KEYS_JSON: ${INGESTION_HMAC_KEYS_JSON:-{}}
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    ports: ["127.0.0.1:${VISION_INGESTION_PORT:-8100}:8100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [vision_backend]

  detection-worker:
    build: {context: ./detection}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision}
      REDIS_URL: redis://redis:6379/0
      VISION_DETECTOR_BACKEND: ${VISION_DETECTOR_BACKEND:-disabled}
      DETECTOR_HTTP_URL: ${DETECTOR_HTTP_URL:-}
      DETECTOR_MODEL_KEY: ${DETECTOR_MODEL_KEY:-}
      DETECTOR_MODEL_VERSION: ${DETECTOR_MODEL_VERSION:-}
      DETECTOR_HTTP_TIMEOUT: ${DETECTOR_HTTP_TIMEOUT:-20}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-visionminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_EVIDENCE_BUCKET:-vision-evidence}
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    networks: [vision_backend]

  rule-worker:
    build: {context: ./rules}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [vision_backend]

  certification-worker:
    build: {context: ./certification}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [vision_backend]

  notification-worker:
    build: {context: ./notifications}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision}
      REDIS_URL: redis://redis:6379/0
      EVOLUTION_ENABLED: ${EVOLUTION_ENABLED:-false}
      EVOLUTION_API_BASE_URL: ${EVOLUTION_API_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_SEND_PATH_TEMPLATE: ${EVOLUTION_SEND_PATH_TEMPLATE:-/message/sendText/{instance}}
      EVOLUTION_TIMEOUT: ${EVOLUTION_TIMEOUT:-15}
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [vision_backend]

  retention-worker:
    build: {context: ./ops}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-visionminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_EVIDENCE_BUCKET:-vision-evidence}
      VISION_RETENTION_DAYS: ${VISION_RETENTION_DAYS:-7}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-86400}
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      minio: {condition: service_started}
    networks: [vision_backend]

  portal-admin:
    build: {context: ./portal-admin}
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:${VISION_ADMIN_PORT:-8083}:8083"]
    networks: [vision_backend]

  portal-client:
    build: {context: ./portal-client}
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:${VISION_CLIENT_PORT:-8084}:8084"]
    networks: [vision_backend]

  p2p-supervisor:
    profiles: ["p2p"]
    build: {context: ./p2p}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision}
      P2P_SDK_PORT_START: ${P2P_SDK_PORT_START:-21000}
      P2P_SDK_PORT_END: ${P2P_SDK_PORT_END:-21999}
      P2P_RTSP_PORT_START: ${P2P_RTSP_PORT_START:-22000}
      P2P_RTSP_PORT_END: ${P2P_RTSP_PORT_END:-22999}
      P2P_LEASE_SECONDS: ${P2P_LEASE_SECONDS:-120}
      P2P_MINIMUM_PROBE_FRAMES: ${P2P_MINIMUM_PROBE_FRAMES:-3}
      INTELBRAS_VENDOR_ADAPTER_ENABLED: ${INTELBRAS_VENDOR_ADAPTER_ENABLED:-false}
      INTELBRAS_VENDOR_ADAPTER_COMMAND: ${INTELBRAS_VENDOR_ADAPTER_COMMAND:-/vendor/intelbras/vision-intelbras-adapter}
      INTELBRAS_VENDOR_ADAPTER_TIMEOUT: ${INTELBRAS_VENDOR_ADAPTER_TIMEOUT:-30}
    depends_on:
      db-migrate: {condition: service_completed_successfully}
    volumes: ["./secrets/vendor/intelbras:/vendor/intelbras:ro"]
    ports: ["127.0.0.1:${VISION_P2P_API_PORT:-8090}:8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [vision_backend]

  stream-broker:
    profiles: ["p2p"]
    build: {context: ./p2p}
    restart: unless-stopped
    command: ["uvicorn", "streambroker:app", "--host", "0.0.0.0", "--port", "8091"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision}
      STREAMBROKER_MIN_PROBE_FRAMES: ${STREAMBROKER_MIN_PROBE_FRAMES:-3}
      STREAMBROKER_FAILURE_THRESHOLD: ${STREAMBROKER_FAILURE_THRESHOLD:-3}
      STREAMBROKER_RECOVERY_THRESHOLD: ${STREAMBROKER_RECOVERY_THRESHOLD:-3}
      STREAMBROKER_FAILOVER_COOLDOWN_SECONDS: ${STREAMBROKER_FAILOVER_COOLDOWN_SECONDS:-120}
    depends_on:
      db-migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${VISION_STREAMBROKER_PORT:-8091}:8091"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [vision_backend]

  failover-orchestrator:
    profiles: ["p2p"]
    build: {context: ./p2p}
    restart: unless-stopped
    command: ["uvicorn", "failover_orchestrator:app", "--host", "0.0.0.0", "--port", "8092"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision}
      P2P_SUPERVISOR_URL: http://p2p-supervisor:8090
      STREAM_BROKER_URL: http://stream-broker:8091
      FAILOVER_REQUEST_TIMEOUT: ${FAILOVER_REQUEST_TIMEOUT:-45}
    depends_on:
      p2p-supervisor: {condition: service_healthy}
      stream-broker: {condition: service_healthy}
    ports: ["127.0.0.1:${VISION_FAILOVER_PORT:-8092}:8092"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [vision_backend]

  p2p-watchdog:
    profiles: ["p2p"]
    build: {context: ./p2p}
    restart: unless-stopped
    command: ["python", "watchdog.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision}
      STREAM_BROKER_URL: http://stream-broker:8091
      FAILOVER_ORCHESTRATOR_URL: http://failover-orchestrator:8092
      P2P_WATCHDOG_INTERVAL_SECONDS: ${P2P_WATCHDOG_INTERVAL_SECONDS:-15}
      P2P_WATCHDOG_HTTP_TIMEOUT: ${P2P_WATCHDOG_HTTP_TIMEOUT:-30}
      P2P_AUTO_FAILOVER_ENABLED: ${P2P_AUTO_FAILOVER_ENABLED:-true}
      INTELBRAS_VENDOR_ADAPTER_ENABLED: ${INTELBRAS_VENDOR_ADAPTER_ENABLED:-false}
      INTELBRAS_VENDOR_ADAPTER_COMMAND: ${INTELBRAS_VENDOR_ADAPTER_COMMAND:-/vendor/intelbras/vision-intelbras-adapter}
      INTELBRAS_VENDOR_ADAPTER_TIMEOUT: ${INTELBRAS_VENDOR_ADAPTER_TIMEOUT:-30}
    depends_on:
      failover-orchestrator: {condition: service_healthy}
    volumes: ["./secrets/vendor/intelbras:/vendor/intelbras:ro"]
    networks: [vision_backend]

  t2u-capture:
    profiles: ["p2p"]
    build: {context: ./p2p}
    restart: unless-stopped
    command: ["uvicorn", "t2u_capture:app", "--host", "0.0.0.0", "--port", "8093"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision}
      T2U_GATEWAY_ROOT: /gateway
      T2U_SDK_LIBRARY: /gateway/sdk/bin/libdhnetsdk.so
      LD_LIBRARY_PATH: /gateway/sdk/bin
      T2U_GATEWAY_HOST: ${T2U_GATEWAY_HOST:-host.docker.internal}
      T2U_CAPTURE_SECONDS: ${T2U_CAPTURE_SECONDS:-4}
      T2U_CAPTURE_TIMEOUT: ${T2U_CAPTURE_TIMEOUT:-25}
    volumes:
      - ${T2U_GATEWAY_ROOT:-./secrets/vendor/intelbras/t2u-gateway}/status:/gateway/status:ro
      - ${T2U_GATEWAY_ROOT:-./secrets/vendor/intelbras/t2u-gateway}/config:/gateway/config:ro
      - ${T2U_GATEWAY_ROOT:-./secrets/vendor/intelbras/t2u-gateway}/sdk:/gateway/sdk:ro
      - ${T2U_GATEWAY_ROOT:-./secrets/vendor/intelbras/t2u-gateway}/imported/config-original/condo-device-map.json:/gateway/condo-device-map.json:ro
      - ${T2U_GATEWAY_ROOT:-./secrets/vendor/intelbras/t2u-gateway}/imported/config-original/fleet-secrets.json:/gateway/fleet-secrets.json:ro
    depends_on:
      db-migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${VISION_T2U_CAPTURE_PORT:-8093}:8093"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [vision_backend]

  t2u-status-sync:
    profiles: ["p2p"]
    build: {context: ./p2p}
    restart: unless-stopped
    command: ["python", "t2u_status_sync.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision}
      T2U_GATEWAY_ROOT: /gateway
      T2U_STATUS_SYNC_INTERVAL_SECONDS: ${T2U_STATUS_SYNC_INTERVAL_SECONDS:-10}
    volumes:
      - ${T2U_GATEWAY_ROOT:-./secrets/vendor/intelbras/t2u-gateway}/status:/gateway/status:ro
      - ${T2U_GATEWAY_ROOT:-./secrets/vendor/intelbras/t2u-gateway}/config:/gateway/config:ro
      - ${T2U_GATEWAY_ROOT:-./secrets/vendor/intelbras/t2u-gateway}/imported/config-original/condo-device-map.json:/gateway/condo-device-map.json:ro
    depends_on:
      db-migrate: {condition: service_completed_successfully}
    networks: [vision_backend]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [vision_backend]

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    networks: [vision_backend]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: [grafana_data:/var/lib/grafana]
    ports: ["127.0.0.1:3000:3000"]
    networks: [vision_backend]

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    restart: unless-stopped
    profiles: ["gpu"]
    cap_add: [SYS_ADMIN]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [vision_backend]

networks:
  vision_backend:
    driver: bridge
    internal: false

volumes:
  prometheus_data:
  grafana_data:

