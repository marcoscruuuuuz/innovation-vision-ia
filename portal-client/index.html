<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISABEL · Logs assertivos</title><style>body{margin:0;font:15px system-ui;background:#0f1115;color:#eef2f7}main{max-width:1100px;margin:auto;padding:28px}.hero{padding:24px 0}.title{font-size:28px;font-weight:750}.muted{color:#9aa4b2}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}input,button{background:#171b22;color:#eef2f7;border:1px solid #343b46;border-radius:10px;padding:11px}button{cursor:pointer}.log,.chat{background:#151920;border:1px solid #292f38;border-radius:14px;padding:16px;margin:10px 0}.meta{display:flex;gap:12px;flex-wrap:wrap;color:#9aa4b2;font-size:13px}.actions{display:flex;gap:8px;margin-top:10px}.privacy{margin-top:24px;padding:12px;border:1px solid #303744;border-radius:10px;color:#aab3c0}.wide{flex:1;min-width:300px}</style></head><body><main><div class=hero><div class=title>ISABEL</div><div class=muted>Pesquise aqui o seu log assertivo</div></div><div class=bar><input id=token type=password placeholder="Token de acesso" style="min-width:300px"><button onclick="saveToken()">Entrar</button></div><div class=chat><strong>ISABEL · consulta somente leitura</strong><div class=bar><input id=question class=wide placeholder="Ex.: quantos logs assertivos tem hoje?"><button onclick="askIsabel()">Perguntar</button></div><div id=answer class=muted></div></div><div class=bar><input id=event placeholder="Evento (opcional)"><button onclick="loadLogs()">Pesquisar logs</button></div><div id=status class=muted></div><div id=logs></div><div class=privacy>Privacidade e retenção: os logs e suas evidências são excluídos automaticamente após 7 dias.</div></main><script>const t=document.getElementById('token');t.value=localStorage.visionClientToken||'';function saveToken(){localStorage.visionClientToken=t.value;loadLogs()}async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+(localStorage.visionClientToken||t.value),'Content-Type':'application/json'};const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function askIsabel(){try{const q=document.getElementById('question').value.trim().toLowerCase();const ev=document.getElementById('event').value.trim()||null;const count=/quant|quantos|quantas|total|hoje/.test(q);const body={intent:count?'count_logs':'search_logs',event_type:ev,limit:20};if(q.includes('hoje')){const d=new Date();d.setHours(0,0,0,0);body.date_from=d.toISOString()}const r=await api('/api/v1/isabel/query',{method:'POST',body:JSON.stringify(body)});document.getElementById('answer').textContent=count?`Encontrei ${r.count} log(s) assertivo(s) no período autorizado.`:`Encontrei ${(r.logs||[]).length} resultado(s).`;if(!count&&r.logs)renderLogs(r.logs.map(x=>({...x,camera_name:x.camera_id,has_evidence:false})))}catch(e){document.getElementById('answer').textContent='Erro: '+e.message}}function renderLogs(rows){document.getElementById('logs').innerHTML=rows.map(x=>`<div class=log><strong>${esc(x.display_name||x.event_type)}</strong><div class=meta><span>${esc(x.camera_name||x.camera_id)}</span><span>${esc(new Date(x.occurred_at).toLocaleString())}</span><span>confiança ${esc(x.confidence)}</span></div>${x.has_evidence?`<div class=actions><button onclick="evidence('${x.id}',false)">Visualizar</button><button onclick="evidence('${x.id}',true)">Baixar</button></div>`:''}</div>`).join('')}async function loadLogs(){try{const ev=document.getElementById('event').value.trim();const q=ev?'?event_type='+encodeURIComponent(ev):'';const rows=await api('/api/v1/client/logs'+q);document.getElementById('status').textContent=rows.length+' log(s)';renderLogs(rows)}catch(e){document.getElementById('status').textContent='Erro: '+e.message}}async function evidence(logId,download){try{const list=await api('/api/v1/client/logs/'+logId+'/evidence');if(!list.length)return;const id=list[0].id;const r=await fetch('/api/v1/client/evidence/'+id+'/'+(download?'download':'view'),{headers:{Authorization:'Bearer '+(localStorage.visionClientToken||t.value)}});if(!r.ok)throw new Error(await r.text());const b=await r.blob();const u=URL.createObjectURL(b);if(download){const a=document.createElement('a');a.href=u;a.download='evidencia';a.click()}else{window.open(u,'_blank')}}catch(e){alert(e.message)}}if(t.value)loadLogs();</script></body></html>
