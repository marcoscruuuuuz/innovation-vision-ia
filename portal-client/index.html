<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISABEL · Portal do Cliente</title><style>body{margin:0;font:15px system-ui;background:#0f1115;color:#eef2f7}main{max-width:1150px;margin:auto;padding:28px}.hero{padding:22px 0}.title{font-size:30px;font-weight:760}.muted{color:#9aa4b2}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input,select,button{background:#171b22;color:#eef2f7;border:1px solid #343b46;border-radius:10px;padding:11px}button{cursor:pointer}.log,.chat,.login,.summary{background:#151920;border:1px solid #292f38;border-radius:14px;padding:16px;margin:10px 0}.meta{display:flex;gap:12px;flex-wrap:wrap;color:#9aa4b2;font-size:13px}.actions{display:flex;gap:8px;margin-top:10px}.privacy{margin-top:24px;padding:12px;border:1px solid #303744;border-radius:10px;color:#aab3c0}.wide{flex:1;min-width:300px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.n{font-size:25px;font-weight:730}</style></head><body><main><div class=hero><div class=title>ISABEL</div><div class=muted>Pesquise aqui o seu log assertivo</div></div><div id=login class=login><strong>Acesso do cliente</strong><div class=bar><input id=user placeholder="Usuário"><input id=pass type=password placeholder="Senha"><button onclick="login()">Entrar</button></div><div id=loginmsg class=muted></div></div><div id=app class=hidden><div class=summary><div class=meta><span id=who></span><span id=tenant></span></div><div id=cards class=grid></div></div><div class=chat><strong>ISABEL · consulta somente leitura</strong><div class=bar><input id=question class=wide placeholder="Ex.: quantos logs assertivos tem hoje?"><button onclick="askIsabel()">Perguntar</button></div><div id=answer class=muted></div></div><div class=bar><select id=condo><option value="">Todos os condomínios autorizados</option></select><input id=event placeholder="Evento (opcional)"><button onclick="loadLogs()">Pesquisar logs</button><button onclick="logout()">Sair</button></div><div id=status class=muted></div><div id=logs></div><div class=privacy>Privacidade e retenção: os logs e suas evidências são excluídos automaticamente após 7 dias.</div></div></main><script>const $=id=>document.getElementById(id);let TOKEN=localStorage.visionClientToken||'';function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function raw(path,opt={}){const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'};return raw(path,opt)}async function login(){try{const r=await raw('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})});if(!['client','admin'].includes(r.role))throw new Error('Perfil sem acesso ao portal do cliente');TOKEN=r.token;localStorage.visionClientToken=TOKEN;start()}catch(e){$('loginmsg').textContent='Erro: '+e.message}}function logout(){localStorage.removeItem('visionClientToken');location.reload()}async function start(){try{const me=await api('/api/v1/auth/me');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Perfil: '+me.role;const condos=await api('/api/v1/client/condominiums');$('tenant').textContent='Condomínios autorizados: '+condos.map(x=>x.name).join(', ');$('condo').innerHTML='<option value="">Todos os condomínios autorizados</option>'+condos.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');await loadLogs()}catch(e){localStorage.removeItem('visionClientToken');TOKEN='';$('loginmsg').textContent='Sessão inválida. Entre novamente.'}}async function askIsabel(){try{const q=$('question').value.trim().toLowerCase();const ev=$('event').value.trim()||null;const count=/quant|quantos|quantas|total|hoje/.test(q);const body={intent:count?'count_logs':'search_logs',event_type:ev,limit:50};if(q.includes('hoje')){const d=new Date();d.setHours(0,0,0,0);body.date_from=d.toISOString()}const r=await api('/api/v1/isabel/query',{method:'POST',body:JSON.stringify(body)});$('answer').textContent=count?`Encontrei ${r.count} log(s) assertivo(s) no período autorizado.`:`Encontrei ${(r.logs||[]).length} resultado(s) dentro do seu acesso.`}catch(e){$('answer').textContent='Erro: '+e.message}}function render(rows){$('logs').innerHTML=rows.map(x=>`<div class=log><strong>${esc(x.display_name||x.event_type)}</strong><div class=meta><span>${esc(x.camera_name||x.camera_id)}</span><span>${new Date(x.occurred_at).toLocaleString()}</span><span>confiança ${esc(x.confidence)}</span></div>${x.has_evidence?`<div class=actions><button onclick="evidence('${x.id}',false)">Visualizar</button><button onclick="evidence('${x.id}',true)">Baixar</button></div>`:''}</div>`).join('')||'<div class=muted>Nenhum log encontrado.</div>';const today=rows.filter(x=>new Date(x.occurred_at).toDateString()===new Date().toDateString()).length;$('cards').innerHTML=`<div><div class=muted>Resultados</div><div class=n>${rows.length}</div></div><div><div class=muted>Hoje</div><div class=n>${today}</div></div>`}async function loadLogs(){try{const q=[];if($('event').value.trim())q.push('event_type='+encodeURIComponent($('event').value.trim()));const rows=await api('/api/v1/client/logs'+(q.length?'?'+q.join('&'):''));let filtered=rows;if($('condo').value)filtered=rows.filter(x=>x.condominium_id===$('condo').value);$('status').textContent=filtered.length+' log(s) assertivo(s)';render(filtered)}catch(e){$('status').textContent='Erro: '+e.message}}async function evidence(logId,download){try{const list=await api('/api/v1/client/logs/'+logId+'/evidence');if(!list.length)return alert('Sem evidência disponível');const item=list.find(x=>x.media_type==='clip')||list[0];const r=await fetch('/api/v1/client/evidence/'+item.id+'/'+(download?'download':'view'),{headers:{Authorization:'Bearer '+TOKEN}});if(!r.ok)throw new Error(await r.text());const b=await r.blob(),u=URL.createObjectURL(b);if(download){const a=document.createElement('a');a.href=u;a.download='evidencia';a.click()}else window.open(u,'_blank')}catch(e){alert(e.message)}}if(TOKEN)start();</script></body></html>
