server {
  listen 8084;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/v1/auth/ {
    proxy_pass http://api:8080/api/v1/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/v1/client/ {
    proxy_pass http://api:8080/api/v1/client/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/v1/isabel/ {
    proxy_pass http://api:8080/api/v1/isabel/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    return 404;
  }

  location / {
    try_files $uri /index.html;
  }
}
