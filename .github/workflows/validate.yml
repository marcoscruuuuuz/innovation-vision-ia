name: validate

on:
  push:
  pull_request:

jobs:
  repository-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml
      - name: Prepare validation environment
        run: cp .env.example .env
      - name: Validate repository
        run: bash scripts/validate_repo.sh
      - name: Compile Python
        run: |
          python3 -m compileall -q core/api/app
          python3 -m compileall -q p2p
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build api p2p-supervisor stream-broker
      - name: Validate migrations on PostgreSQL
        run: |
          docker compose up -d postgres
          docker compose run --rm db-migrate
          docker compose exec -T postgres psql -U vision -d vision -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.stream_routes'), to_regclass('public.p2p_failover_state');"
