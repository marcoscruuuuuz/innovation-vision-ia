name: Vision IA V12 Light CI

on:
  push:
    branches: [visioniav12-light-v1]
    paths:
      - 'visioniav12-light/**'
      - '.github/workflows/visioniav12-light-ci.yml'
  pull_request:
    paths:
      - 'visioniav12-light/**'
      - '.github/workflows/visioniav12-light-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Compile Python
        run: python -m compileall -q visioniav12-light/app

      - name: Unit tests
        env:
          PYTHONPATH: visioniav12-light/app
        run: pytest -q visioniav12-light/tests

      - name: Parse YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in [
              Path('visioniav12-light/config/events.yaml'),
              Path('visioniav12-light/config/gateways.example.yaml'),
              Path('visioniav12-light/infra/cloudflare/config.yml.example'),
          ]:
              value = yaml.safe_load(path.read_text())
              assert isinstance(value, dict), path
              print(path, 'PASS')
          PY

      - name: Validate shell syntax
        run: |
          find visioniav12-light -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

      - name: Validate Docker Compose merge
        working-directory: visioniav12-light
        env:
          APP_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          INITIAL_ADMIN_EMAIL: ci@example.invalid
          INITIAL_ADMIN_PASSWORD: ci-password-not-for-production
          POSTGRES_DB: vision_light
          POSTGRES_USER: vision_light
          POSTGRES_PASSWORD: ci-db-password
          DATABASE_URL: postgresql+psycopg://vision_light:ci-db-password@postgres:5432/vision_light
          MINIO_ROOT_USER: visionlight
          MINIO_ROOT_PASSWORD: ci-minio-password
        run: |
          cp config/gateways.example.yaml config/gateways.yaml
          docker compose config --quiet

      - name: Verify safety defaults
        run: |
          grep -q '^PRODUCTION_WRITER_ENABLED=false$' visioniav12-light/.env.example
          grep -q '^ALLOW_MANUAL_EVENT_INSERT=false$' visioniav12-light/.env.example
          grep -q '^GLOBAL_WINE_T2U_RESTART_ALLOWED=false$' visioniav12-light/.env.example
