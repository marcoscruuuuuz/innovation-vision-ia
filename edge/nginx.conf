server {
  listen 8088;
  server_name _;

  client_max_body_size 16m;

  location = /health {
    proxy_pass http://api:8080/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = / {
    return 302 /admin/;
  }

  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    proxy_pass http://portal-admin:8083/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # Existing admin pages use absolute root links. Redirect them back under
  # /admin so Cloudflare Access on /admin* also protects every admin page.
  location ~ ^/(live|cadastros|logs|p2p|rules|alerts)\.html$ {
    return 302 /admin$uri;
  }

  location = /portal {
    return 301 /portal/;
  }

  location /portal/ {
    proxy_pass http://portal-client:8084/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location / {
    return 404;
  }
}
