<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INNOVATION VISION IA — Admin</title><style>body{margin:0;font:14px system-ui;background:#0b0d10;color:#eef2f7}header{padding:18px 24px;border-bottom:1px solid #252a32;display:flex;gap:12px;align-items:center}main{padding:24px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#13171d;border:1px solid #272d36;border-radius:12px;padding:16px}.n{font-size:28px;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,button,select{background:#181d24;color:#eef2f7;border:1px solid #343c47;border-radius:8px;padding:9px}button{cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:10px;border-bottom:1px solid #262c34;vertical-align:top}.muted{color:#9aa4b2}.ok{color:#7ee787}.warn{color:#f2cc60}.bad{color:#ff7b72}</style></head><body><header><strong>INNOVATION VISION IA · ADMIN</strong><span class="muted">Operação, regras, revisão e logs</span></header><main><div class="row"><input id="token" type="password" placeholder="Token admin" style="min-width:320px"><button onclick="saveToken()">Salvar token</button><button onclick="refreshAll()">Atualizar</button></div><div id="status" class="muted"></div><h2>Resumo</h2><div class="grid" id="cards"></div><h2>Revisão interna</h2><div class="row"><input id="reviewEvent" placeholder="evento (opcional)"><button onclick="loadReview()">Filtrar</button></div><table><thead><tr><th>Data</th><th>Evento</th><th>Câmera</th><th>Confiança</th><th>Status da regra</th><th>Ação</th></tr></thead><tbody id="reviewBody"></tbody></table><h2>Logs aprovados</h2><table><thead><tr><th>Data</th><th>Evento</th><th>Câmera</th><th>Confiança</th><th>Cliente</th></tr></thead><tbody id="logsBody"></tbody></table></main><script>const tokenEl=document.getElementById('token');tokenEl.value=localStorage.visionAdminToken||'';function saveToken(){localStorage.visionAdminToken=tokenEl.value;refreshAll()}async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+(localStorage.visionAdminToken||tokenEl.value),'Content-Type':'application/json'};const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function loadDashboard(){const d=await api('/api/v1/admin/dashboard');const items=[['Câmeras',d.cameras],['Online',d.online],['Revisões',d.review_pending],['Logs hoje',d.logs_today],['Ingestão fila',d.ingestion?.QUEUED||0],['Modelo bloqueado',d.detection?.BLOCKED_MODEL||0]];document.getElementById('cards').innerHTML=items.map(x=>`<div class=card><div class=muted>${esc(x[0])}</div><div class=n>${esc(x[1])}</div></div>`).join('')}async function loadReview(){const e=document.getElementById('reviewEvent').value.trim();const q=e?'?event_type='+encodeURIComponent(e):'';const rows=await api('/api/v1/admin/review'+q);document.getElementById('reviewBody').innerHTML=rows.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString())}</td><td>${esc(x.display_name||x.event_type)}</td><td>${esc(x.camera_name)}</td><td>${esc(x.confidence)}</td><td>${esc(x.certification_status)}</td><td><button onclick="review('${x.id}','APPROVE')">Aprovar</button> <button onclick="review('${x.id}','REJECT')">Rejeitar</button></td></tr>`).join('')}async function review(id,decision){await api('/api/v1/admin/review/'+id,{method:'POST',body:JSON.stringify({decision})});await refreshAll()}async function loadLogs(){const rows=await api('/api/v1/admin/logs?limit=100');document.getElementById('logsBody').innerHTML=rows.map(x=>`<tr><td>${esc(new Date(x.occurred_at).toLocaleString())}</td><td>${esc(x.display_name)}</td><td>${esc(x.camera_name)}</td><td>${esc(x.confidence)}</td><td>${x.client_visible?'sim':'não'}</td></tr>`).join('')}async function refreshAll(){try{document.getElementById('status').textContent='Atualizando…';await Promise.all([loadDashboard(),loadReview(),loadLogs()]);document.getElementById('status').textContent='Atualizado'}catch(e){document.getElementById('status').textContent='Erro: '+e.message}}if(tokenEl.value)refreshAll();</script></body></html>
