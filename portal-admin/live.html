<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VISION IA · Ao vivo</title><style>body{margin:0;font:14px system-ui;background:#0b0d10;color:#eef2f7}main,header{max-width:1500px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}a,button,select{background:#171b22;color:#eef2f7;border:1px solid #343c47;border-radius:8px;padding:9px;text-decoration:none}.row{display:flex;gap:8px;flex-wrap:wrap}.panel{background:#13171d;border:1px solid #272d36;border-radius:12px;padding:14px}.video{display:flex;justify-content:center;align-items:center;min-height:520px;background:#050607;border-radius:12px;overflow:auto}.video img{max-width:100%;max-height:78vh}.muted{color:#9aa4b2}.ok{color:#7ee787}.bad{color:#ff7b72}</style></head><body><header><div><strong>Câmeras AO VIVO</strong><div class=muted>Uma câmera por vez usando a rota RTSP ativa</div></div><div><a href="/">Dashboard</a> <a href="/rules.html">Regras</a></div></header><main><div class="panel row"><select id=condo onchange="loadDvrs()"></select><select id=dvr onchange="loadCameras()"></select><button onclick="prev()">← Anterior</button><select id=camera onchange="openLive()"></select><button onclick="next()">Próxima →</button><button onclick="openLive()">Reconectar</button></div><div class=panel style="margin-top:12px"><div id=meta class=muted></div><div class=video><img id=video alt="Selecione uma câmera"></div><div id=err class=bad></div></div></main><script>const T=localStorage.visionAdminToken||'';if(!T)location.href='/';const $=id=>document.getElementById(id);let D={condominiums:[],dvrs:[],cameras:[]},cams=[];function esc(v){return String(v??'')}async function api(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+T}});if(!r.ok)throw new Error(await r.text());return r.json()}function options(rows,label=x=>x.name){return rows.map(x=>`<option value="${x.id}">${label(x)}</option>`).join('')}async function boot(){D=await api('/api/v1/admin/inventory');$('condo').innerHTML=options(D.condominiums);loadDvrs()}function loadDvrs(){const c=$('condo').value;const rows=D.dvrs.filter(x=>x.condominium_id===c);$('dvr').innerHTML=options(rows);loadCameras()}function loadCameras(){const d=$('dvr').value;cams=D.cameras.filter(x=>x.dvr_id===d);$('camera').innerHTML=options(cams,x=>`Canal ${x.channel} · ${x.name} · ${x.health_state}`);openLive()}function idx(){return Math.max(0,cams.findIndex(x=>x.id===$('camera').value))}function prev(){if(!cams.length)return;$('camera').selectedIndex=(idx()-1+cams.length)%cams.length;openLive()}function next(){if(!cams.length)return;$('camera').selectedIndex=(idx()+1)%cams.length;openLive()}async function openLive(){const id=$('camera').value;if(!id)return;const cam=cams.find(x=>x.id===id);$('video').src='';$('err').textContent='';$('meta').textContent=`${cam?.condominium_name||''} · ${cam?.dvr_name||''} · Canal ${cam?.channel||''} · ${cam?.health_state||''}`;try{const s=await api('/api/v1/admin/cameras/'+id+'/live/status');if(!s.has_live_route)throw new Error('Câmera sem rota ativa. Não será marcada como AO VIVO sem stream real.');$('meta').textContent+=` · ${s.route_source_type||''} · último frame ${s.route_last_frame_at?new Date(s.route_last_frame_at).toLocaleString():'—'}`;$('video').src='/api/v1/admin/cameras/'+id+'/live.mjpeg?token='+encodeURIComponent(T)+'&fps=8&quality=3'}catch(e){$('err').textContent=e.message}}boot().catch(e=>$('err').textContent=e.message);</script></body></html>
