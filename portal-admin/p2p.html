<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VISION IA · P2P/Wine</title><style>body{margin:0;font:14px system-ui;background:#0b0d10;color:#eef2f7}main{max-width:1300px;margin:auto;padding:22px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,button{background:#171b22;color:#eef2f7;border:1px solid #343c47;border-radius:8px;padding:9px}button{cursor:pointer}.card{background:#14181e;border:1px solid #292f38;border-radius:12px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.n{font-size:26px;font-weight:700}.muted{color:#9aa4b2}table{width:100%;border-collapse:collapse}th,td{padding:9px;text-align:left;border-bottom:1px solid #292f38}</style></head><body><main><h1>P2P / Wine</h1><p class=muted>Plano e troca emergencial transacional. A execução real exige o bridge Intelbras autorizado e homologado.</p><div class=bar><input id=token type=password placeholder="Token admin" style="min-width:300px"><button onclick="save()">Salvar token</button><button onclick="refresh()">Atualizar</button></div><div id=cards class=grid></div><div class=card><strong>Trocar túnel por DVR</strong><div class=bar><input id=dvr placeholder="UUID do DVR" style="min-width:330px"><input id=reason value="admin_tunnel_switch" placeholder="Motivo"><button onclick="plan()">Planejar</button><button onclick="executeSwitch()">TROCAR TÚNEL</button></div><pre id=result></pre></div><div class=card><strong>Sessões recentes</strong><table><thead><tr><th>DVR</th><th>Wine</th><th>SDK</th><th>RTSP</th><th>Estado</th><th>Frames</th><th>Início</th></tr></thead><tbody id=rows></tbody></table></div></main><script>const t=document.getElementById('token');t.value=localStorage.visionAdminToken||'';function save(){localStorage.visionAdminToken=t.value;refresh()}async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+(localStorage.visionAdminToken||t.value),'Content-Type':'application/json'};const r=await fetch(path,opt);const text=await r.text();if(!r.ok)throw new Error(text);return text?JSON.parse(text):{}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function refresh(){try{const [s,rows]=await Promise.all([api('/api/v1/admin/p2p/status'),api('/api/v1/admin/p2p/sessions')]);document.getElementById('cards').innerHTML=[['Sessões ativas',s.active_sessions],['Wines saudáveis',s.healthy_wine_workers],['Failovers em curso',s.failovers_in_progress]].map(x=>`<div class=card><div class=muted>${esc(x[0])}</div><div class=n>${esc(x[1])}</div></div>`).join('');document.getElementById('rows').innerHTML=rows.map(x=>`<tr><td>${esc(x.dvr_name)}</td><td>${esc(x.worker_key)}</td><td>${esc(x.sdk_local_port)}</td><td>${esc(x.rtsp_local_port)}</td><td>${esc(x.state)}</td><td>${esc(x.frame_probe_count)}</td><td>${esc(new Date(x.started_at).toLocaleString())}</td></tr>`).join('')}catch(e){document.getElementById('result').textContent='Erro: '+e.message}}async function act(execute){const d=document.getElementById('dvr').value.trim();if(!d)return;try{const r=await api('/api/v1/admin/p2p/failover/'+encodeURIComponent(d),{method:'POST',body:JSON.stringify({reason:document.getElementById('reason').value||'admin_tunnel_switch',execute})});document.getElementById('result').textContent=JSON.stringify(r,null,2);await refresh()}catch(e){document.getElementById('result').textContent='Erro: '+e.message}}function plan(){act(false)}function executeSwitch(){if(confirm('Confirma a troca transacional do túnel deste DVR? O destino só será promovido após validação de frames reais.'))act(true)}if(t.value)refresh();</script></body></html>
