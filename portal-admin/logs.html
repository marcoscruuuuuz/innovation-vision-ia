<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VISION IA · Logs</title><style>body{margin:0;font:14px system-ui;background:#0b0d10;color:#eef2f7}header,main{max-width:1500px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}a,input,select,button{background:#171b22;color:#eef2f7;border:1px solid #343c47;border-radius:8px;padding:9px;text-decoration:none}.row{display:flex;gap:8px;flex-wrap:wrap}.panel{background:#13171d;border:1px solid #272d36;border-radius:12px;padding:14px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:9px;border-bottom:1px solid #272d36;text-align:left}.muted{color:#9aa4b2}</style></head><body><header><div><strong>Sistema de Logs</strong><div class=muted>Busca, revisão, evidências e downloads</div></div><div><a href="/">Dashboard</a> <a href="/live.html">Ao vivo</a></div></header><main><div class="panel row"><select id=condo><option value="">Todos condomínios</option></select><select id=camera><option value="">Todas câmeras</option></select><input id=event placeholder="Evento"><select id=mode><option value=approved>Logs aprovados</option><option value=review>Verificação IA / humana</option></select><button onclick="search()">Buscar</button></div><div id=msg class=muted style="margin:10px 0"></div><div class="panel scroll"><table><thead><tr><th>Data</th><th>Condomínio</th><th>Câmera</th><th>Evento</th><th>Confiança</th><th>Status</th><th>Evidências</th></tr></thead><tbody id=body></tbody></table></div></main><script>const T=localStorage.visionAdminToken||'';if(!T)location.href='/';const $=id=>document.getElementById(id);let I={};function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+T,'Content-Type':'application/json'};const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}async function boot(){I=await api('/api/v1/admin/inventory');$('condo').innerHTML='<option value="">Todos condomínios</option>'+I.condominiums.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('camera').innerHTML='<option value="">Todas câmeras</option>'+I.cameras.map(x=>`<option value="${x.id}">${esc(x.condominium_name)} · ${esc(x.dvr_name)} · ${esc(x.name)}</option>`).join('');search()}async function evidence(logId,cell){try{const rows=await api('/api/v1/admin/logs/'+logId+'/evidence');cell.innerHTML=rows.map(x=>`<button onclick="openEvidence('${x.id}',false)">Visualizar ${esc(x.media_type)}</button> <button onclick="openEvidence('${x.id}',true)">Baixar</button>`).join(' ')||'—'}catch(e){cell.textContent=e.message}}async function openEvidence(id,download){const r=await fetch('/api/v1/admin/evidence/'+id+'/view',{headers:{Authorization:'Bearer '+T}});if(!r.ok)return alert(await r.text());const b=await r.blob(),u=URL.createObjectURL(b);if(download){const a=document.createElement('a');a.href=u;a.download='evidencia';a.click()}else window.open(u,'_blank')}async function search(){try{const q=[];if($('condo').value)q.push('condominium_id='+encodeURIComponent($('condo').value));if($('camera').value)q.push('camera_id='+encodeURIComponent($('camera').value));if($('event').value)q.push('event_type='+encodeURIComponent($('event').value));q.push('limit=300');if($('mode').value==='review'){const rows=await api('/api/v1/admin/review?limit=300'+($('event').value?'&event_type='+encodeURIComponent($('event').value):''));$('body').innerHTML=rows.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.condominium_id)}</td><td>${esc(x.camera_name)}</td><td>${esc(x.display_name||x.event_type)}</td><td>${esc(x.confidence)}</td><td>${esc(x.review_status)} / ${esc(x.certification_status)}</td><td><button onclick="review('${x.id}','APPROVE')">Aprovar</button> <button onclick="review('${x.id}','REJECT')">Rejeitar</button></td></tr>`).join('');$('msg').textContent=rows.length+' pendência(s)';return}const rows=await api('/api/v1/admin/logs?'+q.join('&'));$('body').innerHTML=rows.map(x=>`<tr><td>${new Date(x.occurred_at).toLocaleString()}</td><td>${esc(x.condominium_id)}</td><td>${esc(x.camera_name)}</td><td>${esc(x.display_name)}</td><td>${esc(x.confidence)}</td><td>${esc(x.status)}</td><td id="e${x.id}"><button onclick="evidence('${x.id}',this.parentElement)">Carregar</button></td></tr>`).join('');$('msg').textContent=rows.length+' log(s)'}catch(e){$('msg').textContent='Erro: '+e.message}}async function review(id,decision){await api('/api/v1/admin/review/'+id,{method:'POST',body:JSON.stringify({decision})});search()}boot();</script></body></html>
