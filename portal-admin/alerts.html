<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VISION IA · Alertas</title><style>body{margin:0;font:14px system-ui;background:#0b0d10;color:#eef2f7}header,main{max-width:1400px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}a,input,select,button{background:#171b22;color:#eef2f7;border:1px solid #343c47;border-radius:8px;padding:9px;text-decoration:none}.row{display:flex;gap:8px;flex-wrap:wrap}.panel{background:#13171d;border:1px solid #272d36;border-radius:12px;padding:14px}.muted{color:#9aa4b2}.warn{color:#f2cc60}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #272d36;text-align:left}.scroll{overflow:auto}</style></head><body><header><div><strong>Alertas · Evolution API / WhatsApp</strong><div class=muted>Políticas desacopladas do Rule Engine</div></div><div><a href="/">Dashboard</a> <a href="/logs.html">Logs</a></div></header><main><div class=panel><div class=warn>A chave e URL da Evolution permanecem em variáveis de ambiente/segredos do servidor. Esta tela configura quem recebe quais eventos.</div><div class=row style="margin-top:12px"><select id=condo></select><select id=event></select><select id=channel><option value=WHATSAPP>WhatsApp</option><option value=INTERNAL>Interno</option><option value=WEBHOOK>Webhook</option><option value=EMAIL>Email</option></select><input id=recipient placeholder="Destino / número / referência"><input id=provider placeholder="Instância/provider Evolution"><button onclick="save()">Salvar política</button></div></div><div id=msg class=muted style="margin:10px 0"></div><div class="panel scroll"><table><thead><tr><th>Condomínio</th><th>Evento</th><th>Canal</th><th>Destino</th><th>Provider</th><th>Ativa</th><th></th></tr></thead><tbody id=body></tbody></table></div></main><script>const T=localStorage.visionAdminToken||'';if(!T)location.href='/';const $=id=>document.getElementById(id);let condos=[];async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+T,'Content-Type':'application/json'};const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function boot(){const [inv,cat]=await Promise.all([api('/api/v1/admin/inventory'),api('/api/v1/admin/event-catalog')]);condos=inv.condominiums;$('condo').innerHTML=condos.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('event').innerHTML=Object.keys(cat.events||{}).map(x=>`<option>${x}</option>`).join('');load()}async function load(){const rows=await api('/api/v1/admin/alert-policies');$('body').innerHTML=rows.map(x=>`<tr><td>${esc(condos.find(c=>c.id===x.condominium_id)?.name||x.condominium_id)}</td><td>${esc(x.event_type)}</td><td>${esc(x.channel)}</td><td>${esc(x.recipient_ref)}</td><td>${esc(x.provider||'')}</td><td>${x.enabled?'sim':'não'}</td><td><button onclick="del('${x.id}')">Excluir</button></td></tr>`).join('');$('msg').textContent=rows.length+' política(s)'}async function save(){try{await api('/api/v1/admin/alert-policies',{method:'POST',body:JSON.stringify({condominium_id:$('condo').value,event_type:$('event').value,channel:$('channel').value,recipient_ref:$('recipient').value,provider:$('provider').value||null,enabled:true})});load()}catch(e){$('msg').textContent=e.message}}async function del(id){await api('/api/v1/admin/alert-policies/'+id,{method:'DELETE'});load()}boot();</script></body></html>
