<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VISION IA · Cadastros</title><style>body{margin:0;font:14px system-ui;background:#0b0d10;color:#eef2f7}header,main{max-width:1500px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}a,input,select,textarea,button{background:#171b22;color:#eef2f7;border:1px solid #343c47;border-radius:8px;padding:9px;text-decoration:none}textarea{min-height:70px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.panel{background:#13171d;border:1px solid #272d36;border-radius:12px;padding:14px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1;min-width:120px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #272d36;text-align:left}.scroll{overflow:auto;max-height:420px}.muted{color:#9aa4b2}</style></head><body><header><div><strong>Cadastros</strong><div class=muted>Condomínios · DVRs · Câmeras · Usuários</div></div><div><a href="/">Dashboard</a> <a href="/live.html">Ao vivo</a> <a href="/rules.html">Regras</a></div></header><main><div id=msg class=muted></div><div class=grid><section class=panel><h2>Condomínio</h2><div class=row><input id=ccode placeholder="Código"><input id=cname placeholder="Nome"></div><button onclick="createCondo()">Cadastrar condomínio</button><div class=scroll><table><tbody id=condos></tbody></table></div></section><section class=panel><h2>Dispositivo / DVR</h2><div class=row><select id=dcondo></select><input id=dname placeholder="Nome do dispositivo"></div><div class=row><input id=dmodel placeholder="Modelo"><input id=dchannels type=number placeholder="Qtd. canais"></div><div class=row><input id=dlan placeholder="IP LAN"><input id=dwan placeholder="IP WAN"></div><div class=row><input id=drtsp type=number placeholder="RTSP TCP"><input id=drtspudp type=number placeholder="RTSP UDP"><input id=dp2p type=number placeholder="TCP/P2P"></div><div class=row><input id=dserial placeholder="Secret-ref serial/P2P"><input id=duser placeholder="Secret-ref usuário"><input id=dpass placeholder="Secret-ref senha"></div><div class=row><input id=ddns placeholder="DDNS Intelbras"><input id=dmac placeholder="MAC"></div><textarea id=dnotes placeholder="Observações"></textarea><button onclick="createDvr()">Cadastrar DVR</button><div class=scroll><table><tbody id=dvrs></tbody></table></div></section><section class=panel><h2>Câmera</h2><div class=row><select id=camcondo onchange="filterDvrSelect()"></select><select id=camdvr></select></div><div class=row><input id=channel type=number placeholder="Canal"><input id=camname placeholder="Nome da câmera"></div><button onclick="createCamera()">Cadastrar câmera</button><div class=scroll><table><tbody id=cameras></tbody></table></div></section><section class=panel><h2>Usuário com login e senha</h2><div class=row><input id=username placeholder="Usuário"><input id=password type=password placeholder="Senha (mín. 8)"></div><div class=row><select id=role><option value=client>Cliente</option><option value=admin>Administrador</option><option value=operator>Operador</option><option value=reviewer>Revisor</option></select><select id=usercondo multiple size=5></select></div><button onclick="createUser()">Cadastrar usuário</button><div class=scroll><table><tbody id=users></tbody></table></div></section></div></main><script>const T=localStorage.visionAdminToken||'';if(!T)location.href='/';const $=id=>document.getElementById(id);let DATA={condominiums:[],dvrs:[],cameras:[],users:[]};function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+T,'Content-Type':'application/json'};const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}function opts(rows){return rows.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}function filterDvrSelect(){const c=$('camcondo').value;$('camdvr').innerHTML=opts(DATA.dvrs.filter(x=>x.condominium_id===c))}async function load(){try{DATA=await api('/api/v1/admin/inventory');$('condos').innerHTML=DATA.condominiums.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${x.active?'ativo':'inativo'}</td></tr>`).join('');$('dvrs').innerHTML=DATA.dvrs.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.model||'')}</td><td>${esc(x.ip_lan||'')}</td><td>${esc(x.p2p_state||'')}</td></tr>`).join('');$('cameras').innerHTML=DATA.cameras.map(x=>`<tr><td>${esc(x.condominium_name)}</td><td>${esc(x.dvr_name)}</td><td>${x.channel}</td><td>${esc(x.name)}</td><td>${esc(x.health_state)}</td></tr>`).join('');$('users').innerHTML=DATA.users.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.role)}</td><td>${x.active?'ativo':'inativo'}</td></tr>`).join('');$('dcondo').innerHTML=opts(DATA.condominiums);$('camcondo').innerHTML=opts(DATA.condominiums);$('usercondo').innerHTML=opts(DATA.condominiums);filterDvrSelect();$('msg').textContent='Carregado'}catch(e){$('msg').textContent='Erro: '+e.message}}async function createCondo(){await api('/api/v1/admin/condominiums',{method:'POST',body:JSON.stringify({code:$('ccode').value,name:$('cname').value,active:true})});load()}function n(id){const v=$(id).value;return v?Number(v):null}async function createDvr(){const b={condominium_id:$('dcondo').value,name:$('dname').value,model:$('dmodel').value||null,connection_mode:'intelbras_p2p',serial_secret_ref:$('dserial').value||null,username_secret_ref:$('duser').value||null,password_secret_ref:$('dpass').value||null,ip_lan:$('dlan').value||null,ip_wan:$('dwan').value||null,rtsp_tcp_port:n('drtsp'),rtsp_udp_port:n('drtspudp'),tcp_p2p_port:n('dp2p'),channel_count:n('dchannels'),ddns_host:$('ddns').value||null,mac:$('dmac').value||null,ddns_lan_ip:null,ddns_wan_ip:null,notes:$('dnotes').value||null,enabled:true};await api('/api/v1/admin/dvrs',{method:'POST',body:JSON.stringify(b)});load()}async function createCamera(){await api('/api/v1/admin/cameras',{method:'POST',body:JSON.stringify({condominium_id:$('camcondo').value,dvr_id:$('camdvr').value,channel:Number($('channel').value),name:$('camname').value,enabled:true})});load()}async function createUser(){const condominium_ids=[...$('usercondo').selectedOptions].map(x=>x.value);await api('/api/v1/admin/users-password',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value,role:$('role').value,condominium_ids,active:true})});load()}load();</script></body></html>
