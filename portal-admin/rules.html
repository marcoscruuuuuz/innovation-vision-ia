<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VISION IA · Eventos & Regras</title><style>body{margin:0;font:14px system-ui;background:#0b0d10;color:#eef2f7}header,main{max-width:1600px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}a,input,select,textarea,button{background:#171b22;color:#eef2f7;border:1px solid #343c47;border-radius:8px;padding:9px;text-decoration:none}textarea{width:100%;min-height:75px;box-sizing:border-box}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{min-width:130px}.grid{display:grid;grid-template-columns:minmax(620px,2fr) minmax(360px,1fr);gap:14px}.panel{background:#13171d;border:1px solid #272d36;border-radius:12px;padding:14px}.stage{position:relative;background:#050607;min-height:500px;display:flex;align-items:center;justify-content:center;overflow:auto}.stage img{max-width:100%;max-height:78vh;display:block}.stage canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);cursor:crosshair}.muted{color:#9aa4b2}.warn{color:#f2cc60}.ok{color:#7ee787}.rule{border-top:1px solid #272d36;padding:8px 0}@media(max-width:1000px){.grid{grid-template-columns:1fr}}</style></head><body><header><div><strong>CADASTRO DE EVENTOS DO MONITORAMENTO</strong><div class=muted>Uma câmera por vez · vídeo ao vivo · ROI normalizada</div></div><div><a href="/">Dashboard</a> <a href="/live.html">Ao vivo</a> <a href="/cadastros.html">Cadastros</a></div></header><main><div class=panel><div class=row><select id=condo onchange="loadDvrs()"></select><select id=dvr onchange="loadCameras()"></select><button onclick="prev()">← Câmera anterior</button><select id=camera onchange="selectCamera()"></select><button onclick="next()">Próxima câmera →</button><button onclick="startVideo()">Reabrir vídeo</button></div><div id=camerainfo class=muted></div></div><div class=grid style="margin-top:12px"><section class=panel><div class=stage id=stage><img id=video><canvas id=canvas></canvas></div><div class=row><button onclick="undo()">Desfazer ponto</button><button onclick="clearDraw()">Limpar ROI</button><button onclick="loadSnapshot()">Usar snapshot</button></div><div id=msg class=muted></div></section><section class=panel><h2>Regra da câmera</h2><div class=row><select id=sector onchange="loadSector()"></select><select id=event onchange="eventChanged()"></select></div><div class=row><input id=optional placeholder="Nome opcional do log, ex.: BLOCO 01" style="flex:1"><input id=preview readonly placeholder="Saída do log" style="flex:1"></div><div class=row><select id=gtype><option value=polygon>Área / polígono</option><option value=rectangle>Retângulo</option><option value=line>Linha perimetral / disparo</option><option value=double_line>Linha dupla</option><option value=door_roi_with_auto_line>Porta: quadrado + linha automática</option></select><select id=doorside><option value=left>Linha lado esquerdo</option><option value=right>Linha lado direito</option></select></div><div class=row><label><input id=enabled type=checkbox> Regra ativa</label><select id=status><option>CONFIGURED</option><option>SHADOW</option><option selected>HOMOLOGATION</option><option>AI_REVIEW</option><option>CERTIFIED</option><option>PRODUCTION</option><option>DRAFT</option></select></div><div class=row><input id=duration type=number min=1 value=15 placeholder="Persistência (s)"><input id=confidence type=number min=0 max=1 step=.01 value=.50 placeholder="Confiança mínima"></div><div class=muted id=help></div><p>Parâmetros avançados JSON</p><textarea id=params>{}</textarea><p>Requisitos de modelo JSON</p><textarea id=models>{}</textarea><button onclick="saveRule()">SALVAR NOVA VERSÃO DA REGRA</button><pre id=result></pre><h3>Regras já cadastradas nesta câmera</h3><div id=existing></div></section></div></main><script>const T=localStorage.visionAdminToken||'';if(!T)location.href='/';const $=id=>document.getElementById(id),cv=$('canvas'),ctx=cv.getContext('2d'),vid=$('video');let I={condominiums:[],dvrs:[],cameras:[]},C={},cams=[],points=[];function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+T,'Content-Type':'application/json'};const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}function options(rows,label=x=>x.name){return rows.map(x=>`<option value="${x.id}">${label(x)}</option>`).join('')}async function boot(){[I,C]=await Promise.all([api('/api/v1/admin/inventory'),api('/api/v1/admin/event-catalog')]);$('condo').innerHTML=options(I.condominiums);$('sector').innerHTML=Object.keys(C.sectors||{}).map(x=>`<option>${x}</option>`).join('');loadDvrs();loadSector()}function loadDvrs(){const c=$('condo').value;$('dvr').innerHTML=options(I.dvrs.filter(x=>x.condominium_id===c));loadCameras()}function loadCameras(){const d=$('dvr').value;cams=I.cameras.filter(x=>x.dvr_id===d);$('camera').innerHTML=options(cams,x=>`Canal ${x.channel} · ${x.name} · ${x.health_state}`);selectCamera()}function ci(){return Math.max(0,cams.findIndex(x=>x.id===$('camera').value))}function prev(){if(!cams.length)return;$('camera').selectedIndex=(ci()-1+cams.length)%cams.length;selectCamera()}function next(){if(!cams.length)return;$('camera').selectedIndex=(ci()+1)%cams.length;selectCamera()}async function selectCamera(){clearDraw();const c=cams.find(x=>x.id===$('camera').value);if(!c)return;$('camerainfo').textContent=`${c.condominium_name} · ${c.dvr_name} · Canal ${c.channel} · ${c.name} · ${c.health_state}`;startVideo();loadExisting()}function syncCanvas(){const r=vid.getBoundingClientRect();if(!r.width||!r.height)return;cv.width=Math.round(r.width);cv.height=Math.round(r.height);cv.style.width=r.width+'px';cv.style.height=r.height+'px';draw()}function startVideo(){const id=$('camera').value;if(!id)return;vid.onload=syncCanvas;vid.src='/api/v1/admin/cameras/'+id+'/live.mjpeg?token='+encodeURIComponent(T)+'&fps=8&quality=2&t='+Date.now();$('msg').textContent='Abrindo stream AO VIVO. Se não houver rota real, use snapshot para configurar e corrija o túnel antes de homologar.';setTimeout(syncCanvas,1000)}async function loadSnapshot(){const id=$('camera').value;const r=await fetch('/api/v1/admin/cameras/'+id+'/latest-snapshot',{headers:{Authorization:'Bearer '+T}});if(!r.ok){$('msg').textContent=await r.text();return}vid.src=URL.createObjectURL(await r.blob());$('msg').textContent='Snapshot real carregado.'}cv.onclick=e=>{const r=cv.getBoundingClientRect();points.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]);draw()};function draw(){ctx.clearRect(0,0,cv.width,cv.height);if(!points.length)return;ctx.lineWidth=3;ctx.strokeStyle='#ffd33d';ctx.fillStyle='#ffd33d';ctx.beginPath();points.forEach((p,i)=>{const x=p[0]*cv.width,y=p[1]*cv.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y);ctx.fillRect(x-4,y-4,8,8)});const t=$('gtype').value;if(['polygon','rectangle','door_roi_with_auto_line'].includes(t)&&points.length>2)ctx.closePath();ctx.stroke();if(t==='door_roi_with_auto_line'&&points.length>=2){const xs=points.map(p=>p[0]*cv.width),ys=points.map(p=>p[1]*cv.height),left=Math.min(...xs),right=Math.max(...xs),top=Math.min(...ys),bottom=Math.max(...ys),x=$('doorside').value==='left'?left:right;ctx.beginPath();ctx.strokeStyle='#ff7b72';ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke()}}function undo(){points.pop();draw()}function clearDraw(){points=[];draw()}function loadSector(){const arr=(C.sectors||{})[$('sector').value]||[];$('event').innerHTML=arr.map(x=>`<option value="${x}">${x}</option>`).join('');eventChanged()}function prefix(ev){if(ev==='porta_aberta_bloco')return 'PORTA_ABERTA';return ev.toUpperCase()}function preview(){const opt=$('optional').value.trim();$('preview').value=opt?prefix($('event').value)+'_('+opt.toUpperCase()+')':prefix($('event').value)}$('optional').oninput=preview;function eventChanged(){const e=(C.events||{})[$('event').value]||{};if(e.geometry)$('gtype').value=e.geometry;if(e.default_duration_seconds)$('duration').value=e.default_duration_seconds;$('doorside').style.display=$('event').value==='porta_aberta_bloco'?'':'none';$('help').textContent=e.geometry_required?'Esta regra exige desenho da ROI/linha antes de salvar.':'Geometria opcional para esta regra.';preview()}async function saveRule(){try{const e=(C.events||{})[$('event').value]||{};if(e.geometry_required&&!points.length)throw new Error('Desenhe a ROI/linha obrigatória desta regra.');if($('gtype').value==='line'&&points.length!==2)throw new Error('Linha exige exatamente 2 pontos.');if($('gtype').value==='double_line'&&points.length!==4)throw new Error('Linha dupla exige exatamente 4 pontos: 2 por linha.');if(['polygon','door_roi_with_auto_line'].includes($('gtype').value)&&points.length<3)throw new Error('ROI exige pelo menos 3 pontos.');const advanced=JSON.parse($('params').value||'{}'),models=JSON.parse($('models').value||'{}');const opt=$('optional').value.trim();const geometry={type:$('gtype').value,points,coordinate_system:'normalized_xy_0_1'};if($('gtype').value==='door_roi_with_auto_line')geometry.line_side=$('doorside').value;const parameters={...advanced,min_confidence:Number($('confidence').value),duration_seconds:Number($('duration').value),optional_log_name:opt||null,sector:$('sector').value};if($('event').value==='porta_aberta_bloco'){parameters.open_persistence_seconds=15;parameters.line_side=$('doorside').value;parameters.capture_snapshot=true;parameters.capture_mini_clip=true}const body={camera_id:$('camera').value,event_type:$('event').value,display_label:$('preview').value,enabled:$('enabled').checked,geometry,parameters,model_requirements:models,certification_status:$('status').value};const r=await api('/api/v1/admin/rules',{method:'POST',body:JSON.stringify(body)});$('result').textContent='Salvo: versão '+r.version.version+' · '+r.version.certification_status;loadExisting()}catch(e){$('result').textContent='Erro: '+e.message}}async function loadExisting(){try{const rows=await api('/api/v1/admin/rules?camera_id='+encodeURIComponent($('camera').value));$('existing').innerHTML=rows.map(x=>`<div class=rule><strong>${esc(x.display_label||x.event_type)}</strong><div class=muted>${esc(x.event_type)} · v${x.active_version} · ${esc(x.certification_status)} · ${x.enabled?'ATIVA':'DESATIVADA'}</div></div>`).join('')||'<span class=muted>Sem regras cadastradas.</span>'}catch(e){$('existing').textContent=e.message}}vid.onerror=()=>{$('msg').textContent='Live indisponível para esta câmera. Estado real preservado; não será considerado ONLINE por esta tela.'};window.onresize=syncCanvas;boot().catch(e=>$('msg').textContent=e.message);</script></body></html>
