<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INNOVATION VISION IA · Regras por câmera</title>
<style>:root{color-scheme:dark}body{margin:0;font:14px system-ui;background:#0b0d10;color:#eef2f7}header,main{max-width:1600px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}a,input,select,textarea,button{background:#171b22;color:#eef2f7;border:1px solid #343c47;border-radius:8px;padding:9px;text-decoration:none}textarea{width:100%;min-height:75px;box-sizing:border-box}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{min-width:130px}.grid{display:grid;grid-template-columns:minmax(620px,2fr) minmax(360px,1fr);gap:14px}.panel{background:#13171d;border:1px solid #272d36;border-radius:12px;padding:14px}.stage{position:relative;background:#050607;min-height:500px;display:flex;align-items:center;justify-content:center;overflow:auto}.stage img{max-width:100%;max-height:78vh;display:block}.stage canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);cursor:crosshair}.muted{color:#9aa4b2}.warn{color:#f2cc60}.ok{color:#7ee787}.rule{border-top:1px solid #272d36;padding:8px 0}@media(max-width:1000px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><div><strong>CADASTRO DE EVENTOS DO MONITORAMENTO</strong><div class="muted">Uma câmera por vez · vídeo real · ROI normalizada · regra versionada</div></div><nav><a href="/">Dashboard</a> <a href="/live.html">Ao vivo</a> <a href="/cadastros.html">Cadastros</a> <a href="/logs.html">Logs</a></nav></header>
<main><section class="panel"><div class="row"><select id="condo" onchange="loadDvrs()"></select><select id="dvr" onchange="loadCameras()"></select><button onclick="previousCamera()">← Câmera anterior</button><select id="camera" onchange="selectCamera()"></select><button onclick="nextCamera()">Próxima câmera →</button><button onclick="startVideo()">Reabrir vídeo</button></div><div id="cameraInfo" class="muted"></div></section>
<div class="grid" style="margin-top:12px"><section class="panel"><div class="stage"><img id="video" alt="Vídeo ou snapshot da câmera selecionada"><canvas id="canvas"></canvas></div><div class="row"><button onclick="undoPoint()">Desfazer ponto</button><button onclick="clearRoi()">Limpar ROI</button><button onclick="loadSnapshot()">Usar snapshot real</button></div><div id="videoMessage" class="muted"></div></section>
<section class="panel"><h2>Regra da câmera</h2><div class="row"><select id="sector" onchange="loadEvents()"></select><select id="event" onchange="eventChanged()"></select></div><div class="row"><input id="optionalName" placeholder="Nome opcional do log, ex.: BLOCO 01" style="flex:1"><input id="preview" readonly placeholder="Saída do log" style="flex:1"></div><div class="row"><select id="geometry"><option value="polygon">Área / polígono</option><option value="rectangle">Retângulo</option><option value="line">Linha perimetral / disparo</option><option value="double_line">Linha dupla</option><option value="door_roi_with_auto_line">Porta: quadrado + linha automática</option></select><select id="doorSide"><option value="left">Linha lado esquerdo</option><option value="right">Linha lado direito</option></select></div><div class="row"><label><input id="enabled" type="checkbox"> Regra ativa</label><select id="certification"><option>CONFIGURED</option><option>SHADOW</option><option selected>HOMOLOGATION</option><option>AI_REVIEW</option><option>CERTIFIED</option><option>PRODUCTION</option><option>DRAFT</option></select></div><div class="row"><input id="duration" type="number" min="1" value="15" placeholder="Persistência (s)"><input id="confidence" type="number" min="0" max="1" step=".01" value=".50" placeholder="Confiança mínima"></div><div id="help" class="muted"></div><p>Parâmetros avançados JSON</p><textarea id="parameters">{}</textarea><p>Requisitos de modelo JSON</p><textarea id="models">{}</textarea><button onclick="saveRule()">SALVAR NOVA VERSÃO DA REGRA</button><pre id="result"></pre><h3>Regras cadastradas nesta câmera</h3><div id="existing"></div></section></div></main>
<script>
const T=localStorage.visionAdminToken||'';if(!T)location.href='/';const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),video=$('video');let inventory={condominiums:[],dvrs:[],cameras:[]},catalog={},cameras=[],points=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+T,'Content-Type':'application/json'};const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
function options(rows,label=x=>x.name){return rows.map(x=>`<option value="${x.id}">${esc(label(x))}</option>`).join('')}
async function boot(){[inventory,catalog]=await Promise.all([api('/api/v1/admin/inventory'),api('/api/v1/admin/event-catalog')]);$('condo').innerHTML=options(inventory.condominiums);$('sector').innerHTML=Object.keys(catalog.sectors||{}).map(x=>`<option>${esc(x)}</option>`).join('');loadDvrs();loadEvents()}
function loadDvrs(){const condo=$('condo').value;$('dvr').innerHTML=options(inventory.dvrs.filter(x=>x.condominium_id===condo));loadCameras()}
function loadCameras(){cameras=inventory.cameras.filter(x=>x.dvr_id===$('dvr').value);$('camera').innerHTML=options(cameras,x=>`Canal ${x.channel} · ${x.name} · ${x.health_state}`);selectCamera()}
function selectedCamera(){return cameras.find(x=>x.id===$('camera').value)}function cameraIndex(){return Math.max(0,cameras.findIndex(x=>x.id===$('camera').value))}
function previousCamera(){if(!cameras.length)return;$('camera').selectedIndex=(cameraIndex()-1+cameras.length)%cameras.length;selectCamera()}function nextCamera(){if(!cameras.length)return;$('camera').selectedIndex=(cameraIndex()+1)%cameras.length;selectCamera()}
async function selectCamera(){clearRoi();const camera=selectedCamera();if(!camera)return;$('cameraInfo').textContent=`${camera.condominium_name} · ${camera.dvr_name} · canal ${camera.channel} · ${camera.name} · ${camera.health_state}`;startVideo();loadExisting()}
function syncCanvas(){const r=video.getBoundingClientRect();if(!r.width||!r.height)return;canvas.width=Math.round(r.width);canvas.height=Math.round(r.height);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';draw()}
function startVideo(){const id=$('camera').value;if(!id)return;video.onload=syncCanvas;video.src='/api/v1/admin/cameras/'+id+'/live.mjpeg?token='+encodeURIComponent(T)+'&fps=8&quality=2&t='+Date.now();$('videoMessage').textContent='Abrindo stream ao vivo. Sem rota/frame real, esta câmera não é tratada como online e deve ser corrigida antes da homologação.';setTimeout(syncCanvas,1000)}
async function loadSnapshot(){const r=await fetch('/api/v1/admin/cameras/'+$('camera').value+'/latest-snapshot',{headers:{Authorization:'Bearer '+T}});if(!r.ok){$('videoMessage').textContent=await r.text();return}video.src=URL.createObjectURL(await r.blob());$('videoMessage').textContent='Snapshot real carregado para desenhar a ROI.'}
canvas.onclick=e=>{const r=canvas.getBoundingClientRect();points.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]);draw()};function undoPoint(){points.pop();draw()}function clearRoi(){points=[];draw()}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(!points.length)return;ctx.lineWidth=3;ctx.strokeStyle='#ffd33d';ctx.fillStyle='#ffd33d';ctx.beginPath();points.forEach((p,i)=>{const x=p[0]*canvas.width,y=p[1]*canvas.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y);ctx.fillRect(x-4,y-4,8,8)});const type=$('geometry').value;if(['polygon','rectangle','door_roi_with_auto_line'].includes(type)&&points.length>2)ctx.closePath();ctx.stroke();if(type==='door_roi_with_auto_line'&&points.length>=2){const xs=points.map(p=>p[0]*canvas.width),ys=points.map(p=>p[1]*canvas.height),x=$('doorSide').value==='left'?Math.min(...xs):Math.max(...xs);ctx.beginPath();ctx.strokeStyle='#ff7b72';ctx.moveTo(x,Math.min(...ys));ctx.lineTo(x,Math.max(...ys));ctx.stroke()}}
function loadEvents(){const events=(catalog.sectors||{})[$('sector').value]||[];$('event').innerHTML=events.map(x=>`<option value="${x}">${esc(x)}</option>`).join('');eventChanged()}
function isDoor(){return ['porta_aberta_bloco','porta_bloco_aberta','porta_manutencao'].includes($('event').value)}function eventPrefix(event){return event==='porta_aberta_bloco'?'PORTA_ABERTA':event.toUpperCase()}function updatePreview(){const optional=$('optionalName').value.trim();$('preview').value=optional?eventPrefix($('event').value)+'_('+optional.toUpperCase()+')':eventPrefix($('event').value)}$('optionalName').oninput=updatePreview;
function eventChanged(){const event=(catalog.events||{})[$('event').value]||{};if(event.geometry)$('geometry').value=event.geometry;if(event.default_duration_seconds)$('duration').value=event.default_duration_seconds;if(event.model_requirements)$('models').value=JSON.stringify(event.model_requirements,null,2);$('doorSide').style.display=isDoor()?'':'none';$('certification').disabled=event.force_homologation===true;if(event.force_homologation)$('certification').value='HOMOLOGATION';$('help').textContent=event.force_homologation?'Esta regra permanece em HOMOLOGATION até validação física real.':(event.model_requirements?'Modelo carregado como requisito. Sem adaptador, pesos, câmera e frames reais a execução ficará bloqueada como MODEL_REQUIRED.':(event.geometry_required?'Desenhe a ROI/linha obrigatória antes de salvar.':'Geometria opcional para esta regra.'));updatePreview()}
async function saveRule(){try{const event=(catalog.events||{})[$('event').value]||{},type=$('geometry').value;if(event.geometry_required&&!points.length)throw new Error('Desenhe a ROI/linha obrigatória desta regra.');if(type==='line'&&points.length!==2)throw new Error('Linha exige exatamente 2 pontos.');if(type==='double_line'&&points.length!==4)throw new Error('Linha dupla exige 4 pontos: 2 em cada linha.');if(['polygon','door_roi_with_auto_line'].includes(type)&&points.length<3)throw new Error('ROI exige pelo menos 3 pontos.');const advanced=JSON.parse($('parameters').value||'{}'),models=JSON.parse($('models').value||'{}'),optional=$('optionalName').value.trim();const geometry={type,points,coordinate_system:'normalized_xy_0_1'};if(type==='door_roi_with_auto_line')geometry.line_side=$('doorSide').value;const parameters={...advanced,min_confidence:Number($('confidence').value),duration_seconds:Number($('duration').value),optional_log_name:optional||null,sector:$('sector').value};if(isDoor())Object.assign(parameters,{open_persistence_seconds:15,line_side:$('doorSide').value,capture_snapshot:true,capture_mini_clip:true});const response=await api('/api/v1/admin/rules',{method:'POST',body:JSON.stringify({camera_id:$('camera').value,event_type:$('event').value,display_label:$('preview').value,enabled:$('enabled').checked,geometry,parameters,model_requirements:models,certification_status:$('certification').value})});$('result').textContent='Salvo: versão '+response.version.version+' · '+response.version.certification_status;loadExisting()}catch(e){$('result').textContent='Erro: '+e.message}}
async function loadExisting(){try{const rows=await api('/api/v1/admin/rules?camera_id='+encodeURIComponent($('camera').value));$('existing').innerHTML=rows.map(x=>`<div class="rule"><strong>${esc(x.display_label||x.event_type)}</strong><div class="muted">${esc(x.event_type)} · v${x.active_version} · ${esc(x.certification_status)} · ${x.enabled?'ATIVA':'DESATIVADA'}</div></div>`).join('')||'<span class="muted">Sem regras cadastradas.</span>'}catch(e){$('existing').textContent=e.message}}
video.onerror=()=>{$('videoMessage').textContent='Vídeo ao vivo indisponível. O estado real foi preservado; esta tela não classifica a câmera como ONLINE.'};window.onresize=syncCanvas;boot().catch(e=>$('videoMessage').textContent='Erro: '+e.message);
</script></body></html>
