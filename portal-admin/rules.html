<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VISION IA · Editor de regras</title><style>body{margin:0;font:14px system-ui;background:#0b0d10;color:#eef2f7}main{max-width:1400px;margin:auto;padding:20px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,textarea,button{background:#171b22;color:#eef2f7;border:1px solid #343c47;border-radius:8px;padding:9px}textarea{width:100%;min-height:90px}canvas{max-width:100%;border:1px solid #343c47;border-radius:10px;background:#111}.grid{display:grid;grid-template-columns:minmax(500px,2fr) minmax(300px,1fr);gap:16px}.panel{background:#14181e;border:1px solid #292f38;border-radius:12px;padding:14px}.muted{color:#9aa4b2}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Editor visual de regras</h1><div class=muted>Uma câmera por vez. Clique na imagem para desenhar pontos normalizados. Linha usa 2 pontos; ROI/polígono usa 3 ou mais.</div><div class=bar><input id=token type=password placeholder="Token admin" style="min-width:280px"><input id=camera placeholder="UUID da câmera" style="min-width:300px"><button onclick="saveAuth()">Salvar acesso</button><button onclick="loadSnapshot()">Carregar snapshot</button></div><div class=grid><div class=panel><canvas id=canvas width=960 height=540></canvas><div class=bar><button onclick="undoPoint()">Desfazer ponto</button><button onclick="clearPoints()">Limpar desenho</button></div><div id=msg class=muted></div></div><div class=panel><div class=bar><input id=event placeholder="event_type"><input id=label placeholder="Nome exibido"></div><div class=bar><select id=gtype><option value=polygon>polygon</option><option value=rectangle>rectangle</option><option value=line>line</option><option value=double_line>double_line</option><option value=door_roi_with_auto_line>door_roi_with_auto_line</option></select><select id=status><option>DRAFT</option><option>CONFIGURED</option><option>SHADOW</option><option>HOMOLOGATION</option><option>AI_REVIEW</option><option>CERTIFIED</option><option>PRODUCTION</option></select><label><input id=enabled type=checkbox> habilitada</label></div><p>Parâmetros JSON</p><textarea id=params>{"classes":["person"],"min_confidence":0.5}</textarea><p>Requisitos de modelo JSON</p><textarea id=models>{}</textarea><button onclick="saveRule()">Salvar nova versão</button><pre id=result></pre></div></div></main><script>const token=document.getElementById('token'),cam=document.getElementById('camera'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');token.value=localStorage.visionAdminToken||'';cam.value=localStorage.visionRuleCamera||'';let points=[],img=null;function saveAuth(){localStorage.visionAdminToken=token.value;localStorage.visionRuleCamera=cam.value}function auth(){return {'Authorization':'Bearer '+(localStorage.visionAdminToken||token.value),'Content-Type':'application/json'}}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(img)ctx.drawImage(img,0,0,canvas.width,canvas.height);if(!points.length)return;ctx.lineWidth=3;ctx.strokeStyle='#ffcc00';ctx.fillStyle='#ffcc00';ctx.beginPath();points.forEach((p,i)=>{const x=p[0]*canvas.width,y=p[1]*canvas.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y);ctx.fillRect(x-3,y-3,6,6)});const t=document.getElementById('gtype').value;if(['polygon','rectangle','door_roi_with_auto_line'].includes(t)&&points.length>2)ctx.closePath();ctx.stroke()}canvas.onclick=e=>{const r=canvas.getBoundingClientRect();points.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]);draw()};function clearPoints(){points=[];draw()}function undoPoint(){points.pop();draw()}async function loadSnapshot(){saveAuth();document.getElementById('msg').textContent='Carregando…';const r=await fetch('/api/v1/admin/cameras/'+encodeURIComponent(cam.value)+'/latest-snapshot',{headers:auth()});if(!r.ok){document.getElementById('msg').textContent=await r.text();return}const b=await r.blob(),u=URL.createObjectURL(b);img=new Image();img.onload=()=>{canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;points=[];draw();document.getElementById('msg').textContent='Snapshot carregado'};img.src=u}async function saveRule(){saveAuth();try{const body={camera_id:cam.value,event_type:document.getElementById('event').value,display_label:document.getElementById('label').value||null,enabled:document.getElementById('enabled').checked,geometry:{type:document.getElementById('gtype').value,points},parameters:JSON.parse(document.getElementById('params').value||'{}'),model_requirements:JSON.parse(document.getElementById('models').value||'{}'),certification_status:document.getElementById('status').value};const r=await fetch('/api/v1/admin/rules',{method:'POST',headers:auth(),body:JSON.stringify(body)});document.getElementById('result').textContent=await r.text()}catch(e){document.getElementById('result').textContent=e.message}}</script></body></html>
